<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Disc Golf GPS & Bag Master</title>
    <meta name="theme-color" content="#0b1319">
    <style>
        :root {
            --bg-primary: #0b1319;
            --bg-card: #15222e;
            --bg-card-accent: #1e3040;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 16px; max-width: 500px; margin: 0 auto; user-select: none; }
        
        header { text-align: center; padding: 10px 0 14px; }
        .logo-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-green); font-weight: 700; }
        h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); color: var(--text-sub); border-radius: var(--radius-md); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .display-card { background: linear-gradient(145deg, var(--bg-card), var(--bg-card-accent)); border-radius: var(--radius-lg); padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 14px; }
        .label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .distance-val { font-size: 56px; font-weight: 900; line-height: 1; color: #ffffff; margin: 6px 0; }
        .unit { font-size: 20px; color: var(--accent-green); font-weight: 700; }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--text-sub); }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #f59e0b; }
        .pulse-dot.active { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .gps-info { display: flex; justify-content: space-between; background: rgba(21, 34, 46, 0.6); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 14px; font-size: 12px; }

        .section-box { background: var(--bg-card); border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .input-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-sub); font-weight: 700; margin-bottom: 8px; display: block; }
        .select-input, .text-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; outline: none; margin-bottom: 8px; }

        .btn { width: 100%; padding: 14px; border-radius: var(--radius-md); border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; box-shadow: 0 4px 15px var(--accent-green-glow); }
        .btn-secondary { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; }
        .btn-outline { background: transparent; color: var(--text-sub); border: 1px solid rgba(255,255,255,0.15); }
        .btn-danger { background: var(--danger); color: #fff; padding: 6px 10px; font-size: 12px; width: auto; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .disc-item { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .disc-item-left { display: flex; align-items: center; gap: 10px; }
        .disc-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-green); background: #000; }
        .checkbox-custom { width: 22px; height: 22px; accent-color: var(--accent-green); cursor: pointer; }

        .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: var(--bg-card); border-radius: var(--radius-md); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
        .history-item .num { font-weight: 800; font-size: 18px; color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <div class="logo-tag">Disc Golf GPS</div>
        <h1>Heittoetäisyys & Bägi</h1>
    </header>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="switchTab('tracker')">📍 Mittari</div>
        <div class="tab-btn" onclick="switchTab('bag')">🥏 Oma Bägi (<span id="bag-count">0</span>)</div>
    </div>

    <!-- TAB 1: GPS MITTARI -->
    <div id="tab-tracker" class="tab-content active">
        <div class="display-card">
            <div class="label" id="mode-label">Nykyinen Etäisyys</div>
            <div class="distance-val"><span id="distance">0.0</span><span class="unit">m</span></div>
            <div class="status-badge">
                <span class="pulse-dot" id="gps-dot"></span>
                <span id="status-text">Odotetaan GPS-signaalia...</span>
            </div>
        </div>

        <div class="gps-info">
            <div>GPS Tarkkuus: <strong id="accuracy">-- m</strong></div>
            <div>Tiipaikka: <strong id="start-status">Ei asetettu</strong></div>
        </div>

        <div class="section-box">
            <label class="input-label">Valitse heitetty kiekko</label>
            <select class="select-input" id="disc-select"></select>
        </div>

        <div style="margin-bottom: 16px;">
            <button class="btn btn-primary" id="btn-start" onclick="setStartPoint()">📍 Merkitse tiipaikka</button>
            <button class="btn btn-secondary" id="btn-lock" onclick="lockDistance()" disabled>🎯 Tallenna heitto</button>
            <button class="btn btn-outline" onclick="resetMeasurement()">🔄 Nollaa mittaus</button>
        </div>

        <div class="section-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span class="input-label" style="margin:0;">Tallennetut heitot</span>
                <button style="background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer;" onclick="clearHistory()">Tyhjennä</button>
            </div>
            <ul class="history-list" id="history-list"></ul>
        </div>
    </div>

    <!-- TAB 2: OMA BÄGI -->
    <div id="tab-bag" class="tab-content">
        <div class="section-box">
            <span class="input-label">Lisää uusi kiekko bägiiin</span>
            <input type="text" class="text-input" id="new-disc-name" placeholder="Kiekon nimi (esim. Star Destroyer)">
            
            <label class="btn btn-outline" style="margin-bottom: 8px;">
                📷 Ota tai valitse kuva
                <input type="file" id="new-disc-photo" accept="image/*" capture="environment" style="display: none;" onchange="handlePhotoSelect(event)">
            </label>
            <div id="photo-status" style="font-size: 11px; color: var(--accent-green); text-align: center; margin-bottom: 8px;"></div>
            
            <button class="btn btn-primary" onclick="addDiscToBag()">+ Tallenna kiekko bägiiin</button>
        </div>

        <div class="section-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span class="input-label" style="margin:0;">Bägin sisältö (Tarkista kiekot)</span>
                <button class="btn btn-outline" style="width:auto; padding:4px 8px; font-size:11px; margin:0;" onclick="checkAllDiscs(true)">Valitse kaikki</button>
            </div>
            <div id="bag-list"></div>
        </div>
    </div>

    <script>
        let startCoords = null;
        let currentCoords = null;
        let lastDistance = 0;
        let tempPhotoBase64 = null;

        let bag = JSON.parse(localStorage.getItem('dg_bag_v2')) || [
            { id: 1, name: "Innova Destroyer", photo: "", inBag: true },
            { id: 2, name: "Discraft Buzzz", photo: "", inBag: true }
        ];
        let history = JSON.parse(localStorage.getItem('dg_history_v2') || '[]');

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tabName === 'tracker') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-tracker').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-bag').classList.add('active');
            }
        }

        function saveBag() {
            localStorage.setItem('dg_bag_v2', JSON.stringify(bag));
            renderBagUI();
            populateDiscSelect();
        }

        function renderBagUI() {
            const list = document.getElementById('bag-list');
            document.getElementById('bag-count').innerText = bag.length;
            list.innerHTML = '';

            if (bag.length === 0) {
                list.innerHTML = '<div style="color:var(--text-sub); font-size:13px; text-align:center; padding:10px;">Bägi on tyhjä. Lisää kiekkoja ylhäältä!</div>';
                return;
            }

            bag.forEach((disc, idx) => {
                const item = document.createElement('div');
                item.className = 'disc-item';

                const imgHtml = disc.photo ? `<img src="${disc.photo}" class="disc-thumb">` : `<span style="font-size:24px;">🥏</span>`;

                item.innerHTML = `
                    <div class="disc-item-left">
                        <input type="checkbox" class="checkbox-custom" ${disc.inBag ? 'checked' : ''} onchange="toggleInBag(${idx})">
                        ${imgHtml}
                        <div>
                            <div style="font-weight:700; font-size:14px;">${disc.name}</div>
                            <div style="font-size:11px; color:${disc.inBag ? 'var(--accent-green)' : 'var(--danger)'};">
                                ${disc.inBag ? 'Mukana bägissä' : 'Puuttuu / Hukassa'}
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="removeDisc(${idx})">Poista</button>
                `;
                list.appendChild(item);
            });
        }

        function toggleInBag(idx) {
            bag[idx].inBag = !bag[idx].inBag;
            saveBag();
        }

        function checkAllDiscs(status) {
            bag.forEach(d => d.inBag = status);
            saveBag();
        }

        function removeDisc(idx) {
            if (confirm(`Poistetaanko "${bag[idx].name}" bägistä?`)) {
                bag.splice(idx, 1);
                saveBag();
            }
        }

        function handlePhotoSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('photo-status').innerText = "Kuva ladattu valmiiksi ✓";
                }
            };
            reader.readAsDataURL(file);
        }

        function addDiscToBag() {
            const nameInput = document.getElementById('new-disc-name');
            const name = nameInput.value.trim();
            if (!name) { alert("Kirjoita kiekon nimi!"); return; }

            bag.push({
                id: Date.now(),
                name: name,
                photo: tempPhotoBase64 || "",
                inBag: true
            });

            nameInput.value = '';
            tempPhotoBase64 = null;
            document.getElementById('photo-status').innerText = '';
            saveBag();
        }

        function populateDiscSelect() {
            const select = document.getElementById('disc-select');
            select.innerHTML = '';
            const activeDiscs = bag.filter(d => d.inBag);

            if (activeDiscs.length === 0) {
                select.innerHTML = '<option value="">Ei kiekkoja bägissä</option>';
                return;
            }

            activeDiscs.forEach((d) => {
                const opt = document.createElement('option');
                opt.value = d.name;
                opt.innerText = d.name;
                select.appendChild(opt);
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentCoords = position.coords;
                        document.getElementById('accuracy').innerText = `±${Math.round(position.coords.accuracy)} m`;
                        document.getElementById('gps-dot').classList.add('active');
                        document.getElementById('status-text').innerText = "GPS Aktiivinen";

                        if (startCoords) {
                            const dist = calculateDistance(
                                startCoords.latitude, startCoords.longitude,
                                currentCoords.latitude, currentCoords.longitude
                            );
                            lastDistance = dist.toFixed(1);
                            document.getElementById('distance').innerText = lastDistance;
                        }
                    },
                    (error) => {
                        document.getElementById('status-text').innerText = "GPS-virhe: " + error.message;
                        document.getElementById('gps-dot').classList.remove('active');
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
                );
            }
        }

        function setStartPoint() {
            if (!currentCoords) { alert("Odotetaan GPS-signaalia..."); return; }
            startCoords = { latitude: currentCoords.latitude, longitude: currentCoords.longitude };
            document.getElementById('start-status').innerText = "Asetettu ✓";
            document.getElementById('start-status').style.color = "#10b981";
            document.getElementById('btn-lock').disabled = false;
            document.getElementById('mode-label').innerText = "Kävele kiekolle...";
            document.getElementById('distance').innerText = "0.0";
        }

        function lockDistance() {
            if (!startCoords || !currentCoords) return;
            const select = document.getElementById('disc-select');
            const discName = select.value || "Tuntematon kiekko";
            const foundDisc = bag.find(d => d.name === discName);
            
            const record = {
                disc: discName,
                photo: foundDisc ? foundDisc.photo : "",
                distance: lastDistance,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            history.push(record);
            localStorage.setItem('dg_history_v2', JSON.stringify(history));
            renderHistoryUI();
            document.getElementById('mode-label').innerText = "Tallennettu!";
        }

        function renderHistoryUI() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            if (history.length === 0) {
                list.innerHTML = '<li style="color:var(--text-sub); font-size:12px; text-align:center; padding:8px;">Ei heittoja.</li>';
                return;
            }
            history.slice().reverse().forEach((item) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                const img = item.photo ? `<img src="${item.photo}" class="disc-thumb" style="width:32px;height:32px;">` : `🥏`;
                li.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${img}
                        <div>
                            <div style="font-weight:700; font-size:13px;">${item.disc}</div>
                            <div style="font-size:10px; color:var(--text-sub);">${item.time}</div>
                        </div>
                    </div>
                    <div><span class="num">${item.distance}</span> <span style="font-size:12px; color:var(--text-sub);">m</span></div>
                `;
                list.appendChild(li);
            });
        }

        function resetMeasurement() {
            startCoords = null;
            lastDistance = 0;
            document.getElementById('distance').innerText = "0.0";
            document.getElementById('start-status').innerText = "Ei asetettu";
            document.getElementById('mode-label').innerText = "Nykyinen Etäisyys";
            document.getElementById('btn-lock').disabled = true;
        }

        function clearHistory() {
            if (confirm("Tyhjennetäänkö heittohistoria?")) {
                history = [];
                localStorage.removeItem('dg_history_v2');
                renderHistoryUI();
            }
        }

        window.onload = () => {
            initGPS();
            renderBagUI();
            populateDiscSelect();
            renderHistoryUI();
        };
    </script>
</body>
</html>
